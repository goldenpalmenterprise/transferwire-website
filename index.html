<style id="tw-design">
  html, body { background: #F5F6F2; }
:root { --tw-page:#F5F6F2; --tw-card:#FFFFFF; --tw-ink:#14181D; --tw-muted:#667085; --tw-hair:#E1E5E2; --tw-hair-hover:#CFD7D1; }
.tw-card { background:#FFFFFF; border:1px solid #E1E5E2 !important; border-radius:14px !important; box-shadow:none !important; padding:20px 22px 18px !important; }
.tw-card:hover { border-color:#CFD7D1 !important; box-shadow:0 8px 24px rgba(15,23,42,.06) !important; transform:translateY(-1px); }
.tw-main select, .tw-main input:not([type="checkbox"]):not([type="radio"]), .tw-main textarea { min-height:44px !important; border-radius:10px !important; border:1px solid #E1E5E2 !important; background:#fff; }
.tw-main textarea { min-height:96px !important; }
.tw-main > div > h2, .tw-main > section > h2, .tw-main > div > div > h2:first-child { font-size:30px !important; line-height:38px !important; margin:0 0 6px !important; }
.tw-main > div > h2 + p, .tw-main > section > h2 + p, .tw-main > div > h2 + div { font-size:14.5px !important; line-height:1.5 !important; color:#667085 !important; margin:0 0 22px !important; }
.tw-tile { border:1px solid #E1E5E2 !important; border-radius:14px !important; }
.tw-tile:hover { border-color:#CFD7D1 !important; box-shadow:0 8px 24px rgba(15,23,42,.06) !important; }
  .tw-card { transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease; }
  
  .tw-skel { position: relative; overflow: hidden; background: #eaeef4; border-radius: 14px; }
  .tw-skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); animation: twshimmer 1.15s infinite; }
  @keyframes twshimmer { 100% { transform: translateX(100%); } }
  .tw-tabs { scrollbar-width: none; }
  .tw-tabs::-webkit-scrollbar { display: none; }
  @media (max-width: 780px) {
    .tw-tabs { flex-wrap: nowrap !important; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
    .tw-main { padding-left: 12px !important; padding-right: 12px !important; }
  }
  button { transition: filter .14s ease; }
  button:hover { filter: brightness(.97); }
  :focus-visible { outline: 2px solid #149a59; outline-offset: 2px; border-radius: 6px; }
  .tw-fab { width: 56px !important; height: 56px !important; border-radius: 999px !important; background: #0f1520 !important; box-shadow: 0 10px 26px rgba(15,21,32,.35) !important; position: relative; }

  .tw-fab::after { content: ""; position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 99px; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
  .tw-pos-grid { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important; gap: 12 !important; }
  .tw-main.feed > * { grid-column: 1; min-width: 0; }
  .tw-main.feed > aside { grid-column: 2; grid-row: 1 / span 3; align-self: start; }
  .tw-main.feed > aside:empty { display: none; }
  html.tw-dark { background: #0d1117; }
  html.tw-dark::before { content: ""; position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; backdrop-filter: invert(1) hue-rotate(180deg); -webkit-backdrop-filter: invert(1) hue-rotate(180deg); }

    .tw-lang { margin-left: auto; }
  }
  .tw-main select, .tw-main input:not([type="checkbox"]):not([type="radio"]) { min-height: 42px; border-radius: 9px; box-sizing: border-box; }

  .tw-tabs button, .tw-tile, .tw-chip { transition: background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease; }

  } catch (err) {}
